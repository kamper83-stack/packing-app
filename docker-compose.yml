version: '3.8'

services:
  backend:
    build: ./backend
    container_name: packing-backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - JWT_SECRET=super_secret_jwt_token_change_me
      - WEATHER_API_KEY=your_weather_api_key_here
      - GEMINI_API_KEY=your_gemini_api_key_here
      - USE_MOCKS=true
    volumes:
      - sqlite-data:/app/data
      
  frontend:
    build: .
    container_name: packing-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlite-data:
