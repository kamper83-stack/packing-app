version: '3.8'

services:
  backend:
    build: ./backend
    container_name: packing-backend
    restart: always
    ports:
      - "5001:5001"
    # Provide real secrets via a root .env file or the shell environment
    # (e.g. `WEATHER_API_KEY=... docker compose up`). The `:-placeholder`
    # defaults below only exist so the stack still boots without them — with
    # a placeholder key the backend runs in mock mode (no live forecasts).
    # Get a free WeatherAPI key at https://www.weatherapi.com/.
    # Do NOT hardcode real keys here; this file is committed to git.
    environment:
      - PORT=5001
      - JWT_SECRET=${JWT_SECRET:-dev_insecure_jwt_secret_change_me}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-your_weather_api_key_here}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
      - USE_MOCKS=${USE_MOCKS:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
    volumes:
      - sqlite-data:/app/data
      
  frontend:
    build: .
    container_name: packing-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlite-data:
