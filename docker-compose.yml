version: '3.8'

services:
  backend:
    build: ./backend
    container_name: packing-backend
    restart: always
    ports:
      - "5001:5001"
    # Provide real secrets via a root .env file or the shell environment.
    # Missing credentials must stop a production-oriented Compose invocation;
    # mock mode is an explicit development/test choice, never an accidental
    # fallback in a deployment.
    environment:
      - PORT=5001
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - WEATHER_API_KEY=${WEATHER_API_KEY:?WEATHER_API_KEY must be set}
      - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY must be set}
      - USE_MOCKS=${USE_MOCKS:?USE_MOCKS must be set}
    volumes:
      - sqlite-data:/app/data
      
  frontend:
    build: .
    container_name: packing-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlite-data:
