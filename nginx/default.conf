server {
    listen 80;
    server_name localhost;

    # Security response headers (issue #174 / StoreReadiness A6, gap G5).
    # Declared at the server level with `always` so every response — the SPA
    # shell, the static /privacy and /.well-known endpoints, the /api proxy,
    # and error responses (e.g. a 404 for a missing assetlinks.json) — carries
    # them. None of the location blocks below set their own add_header, so each
    # inherits this full set (nginx add_header inheritance replaces, not merges).
    #
    # HSTS is honoured by browsers only over HTTPS; the host nginx terminates
    # TLS for packing.erankam.dev and proxies here, so the header reaches the
    # client on the secure origin. No `preload` — that is a standalone, hard to
    # reverse commitment we are not making from this change.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP tuned for this Create React App build: it is a same-origin app (it
    # calls /api on its own origin and loads no cross-origin scripts, styles,
    # fonts or images), so everything is locked to 'self'. `script-src` and
    # `style-src` keep 'unsafe-inline' as a deliberate safety margin: CRA's
    # INLINE_RUNTIME_CHUNK defaults on, so a build that emits a separate runtime
    # chunk ships it as an inline <script>, and the current build would otherwise
    # be bricked by a stricter policy on any such change. Hardening to nonces/
    # hashes is a separate follow-up (see PR). `object-src 'none'` and
    # `frame-ancestors 'self'` add clickjacking/plugin protection without
    # affecting the Play/TWA flow (a TWA is not an iframe embed). `data:`/`blob:`
    # cover inlined icons and the favicon/manifest assets.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'" always;

    # Frontend React static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Store-readiness static endpoints (issue #173 / StoreReadiness A4).
    # They must NEVER fall back to the SPA shell: a privacy policy page that
    # silently serves index.html, or an assetlinks.json that serves HTML,
    # blocks Google Play / TWA verification. A missing file fails loudly (404).
    location = /privacy {
        root /usr/share/nginx/html;
        try_files /privacy.html =404;
    }

    location = /.well-known/assetlinks.json {
        root /usr/share/nginx/html;
        default_type application/json;
        try_files $uri =404;
    }

    # Proxy API requests to backend container
    location /api {
        proxy_pass http://backend:5001/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
