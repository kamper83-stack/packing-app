name: CD Deployment (Docker Compose via SSH)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-production to confirm the production deployment.
        required: true
        type: string

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy-production' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate deployment inputs
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          USE_MOCKS: ${{ secrets.USE_MOCKS }}
        run: bash scripts/deployment-preflight.sh

      # Optional: Connect to your Tailscale network if your VPS is not publicly reachable
      # Requires adding TAILSCALE_AUTH_KEY to your GitHub Secrets.
      # If your SSH host is already accessible or you handle routing differently, you can remove this step.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
        continue-on-error: true # Allow deployment to proceed if Tailscale is not fully configured

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          USE_MOCKS: ${{ secrets.USE_MOCKS }}
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: JWT_SECRET,GEMINI_API_KEY,WEATHER_API_KEY,USE_MOCKS
          script: |
            echo "Starting Deployment..."
            # Adjust the path to your project folder on the VPS
            cd ~/packing_app || cd /var/www/packing_app || (echo "Project folder not found!" && exit 1)

            # Refuse to deploy with an unset or placeholder JWT secret.
            if [ -z "$JWT_SECRET" ] || [ "$JWT_SECRET" = "dev_insecure_jwt_secret_change_me" ]; then
              echo "JWT_SECRET is missing or still the dev placeholder. Add it to repo secrets and retry."
              exit 1
            fi

            # Pull latest changes
            git pull origin main

            # Write production secrets consumed by docker-compose interpolation.
            printf "JWT_SECRET=%s\nGEMINI_API_KEY=%s\nWEATHER_API_KEY=%s\nUSE_MOCKS=%s\n" \
              "$JWT_SECRET" \
              "$GEMINI_API_KEY" \
              "${WEATHER_API_KEY:-your_weather_api_key_here}" \
              "${USE_MOCKS:-false}" > .env
            chmod 600 .env

            JWT_SECRET="$JWT_SECRET" \
            GEMINI_API_KEY="$GEMINI_API_KEY" \
            WEATHER_API_KEY="${WEATHER_API_KEY:-your_weather_api_key_here}" \
            USE_MOCKS="${USE_MOCKS:-false}" \
              bash scripts/deployment-preflight.sh

            # Build and launch Docker Compose stack
            echo "Rebuilding and restarting docker containers..."
            docker compose down
            docker compose up --build -d

            # Clean up old unused Docker images
            docker image prune -f

            # Post-deployment check: verify backend environment & weather readiness
            echo "Verifying backend and weather service..."
            docker compose exec -T backend node -e "require('./services/weatherService').getForecast('London', new Date().toISOString().split('T')[0], new Date().toISOString().split('T')[0]).then(r => console.log('[POST-DEPLOY] Weather check finished. isMock=' + r.isMock + (r.error ? ' (error: ' + r.error + ')' : '')))"

            echo "Deployment Completed Successfully!"
