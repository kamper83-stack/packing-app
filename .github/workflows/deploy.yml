name: CD Deployment (disabled pending safe SHA-pinned implementation)

# Production deployment is deliberately NOT automatic. The former workflow_run
# trigger could deploy whatever main happened to point at after CI, before an
# independent expert had approved that exact post-squash artifact. It also
# performed a mutable `git pull` and rewrote production .env. See AGENTS.md for
# the currently verified, manually approved SHA-pinned procedure.
#
# Keep workflow_dispatch only as a visible, auditable guardrail: it must fail
# rather than accidentally exercise the legacy production-deploy path. A future
# workflow may replace this only after implementing the same exact-SHA,
# fresh-backup, clean-build-context, env-preservation, and post-deploy gates.
on:
  workflow_dispatch:

jobs:
  deployment-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unsafe GitHub Actions production deployment
        run: |
          echo "::error::GitHub Actions production deployment is intentionally disabled pending a safe SHA-pinned implementation."
          echo "Use the manual SHA-pinned procedure in AGENTS.md only after a current expert deploy APPROVE for the exact artifact and a fresh database backup."
          exit 1
