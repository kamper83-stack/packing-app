version: '3.8'

services:
  backend:
    build: ./backend
    container_name: packing-backend
    restart: always
    ports:
      -  "127.0.0.1:3026:5001"
    # Provide secrets through a root .env file or the shell environment. The
    # placeholder keeps a key-less stack in safe mock mode. Do not hardcode keys
    # in this committed file.
    environment:
      - PORT=5001
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required — set it in the root .env file or the shell environment}
      - GOOGLE_WEATHER_API_KEY=${GOOGLE_WEATHER_API_KEY:-your_google_weather_api_key_here}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY:-your_rapidapi_key_here}
      - USE_MOCKS=${USE_MOCKS:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
    volumes:
      - sqlite-data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: .
    container_name: packing-frontend
    restart: always
    ports:
      - "127.0.0.1:3025:80"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sqlite-data:
